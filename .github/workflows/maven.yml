name: SonarQube Analysis - Spring Boot Maven

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build e Análise SonarQube
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código com histórico completo do Git (necessário para atribuição de linhas/blame no Sonar)
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuração da JDK (ajuste a versão conforme seu projeto: 17, 21, etc.)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Cache de pacotes do SonarQube para acelerar builds subsequentes
      - name: Cache dos pacotes do SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 4. Compilação, testes e execução do Scanner do SonarQube
      - name: Build, Testes e Análise Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=meu-projeto-springboot \
            -Dsonar.projectName="Meu Projeto Spring Boot" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
